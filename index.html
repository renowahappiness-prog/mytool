<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乱数ジェネレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="global-header" id="header-placeholder"></header>

<div class="container">
    <h2>乱数ジェネレーター</h2>
    
    <div class="settings-group">
        <div class="input-group">
            <label for="min-num">最小値</label>
            <input type="number" id="min-num" value="1" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="max-num">最大値</label>
            <input type="number" id="max-num" value="100" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="count">作成個数</label>
            <input type="number" id="count" value="10" min="1" max="10000" oninput="checkCount()" onchange="saveSettings()">
        </div>
    </div>

    <div class="warning-text" id="warning-text"></div>

    <div class="btn-group">
        <button class="generate-btn" onclick="generateRandomNumbers()">乱数を作成</button>
        <button class="copy-all-btn" onclick="copyAllText()">一括コピー</button>
        <button class="download-btn" onclick="downloadCSV()">CSV保存</button>
        <button class="reset-btn" onclick="resetSettings()">リセット</button>
    </div>

    <div class="result-area" id="result-area">
    </div>
    
    <div class="msg" id="copy-msg"></div>
    
<div class="ad-space-bottom">
    <span class="ad-label">スポンサーリンク</span>
    <div class="ad-box">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/d149ee751a7bfab9ce516b030c1e447d"></script>
    <!-- admax -->
    </div>
</div>
</div>
<script>
    function loadHeader() {
        fetch('header.html')
            .then(response => {
                if (!response.ok) throw new Error('ヘッダーの読み込みに失敗しました');
                return response.text();
            })
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-random');
                if (activeLink) activeLink.classList.add('active');
            })
            .catch(error => console.error(error));
    }

    let currentRandomNumbers = [];

    function saveSettings() {
        const settings = {
            min: document.getElementById('min-num').value,
            max: document.getElementById('max-num').value,
            count: document.getElementById('count').value
        };
        localStorage.setItem('randomGeneratorSettingsSimple', JSON.stringify(settings));
    }

    function loadSettings() {
        const savedData = localStorage.getItem('randomGeneratorSettingsSimple');
        if (!savedData) return;

        try {
            const settings = JSON.parse(savedData);
            if (settings.min !== undefined) document.getElementById('min-num').value = settings.min;
            if (settings.max !== undefined) document.getElementById('max-num').value = settings.max;
            if (settings.count !== undefined) document.getElementById('count').value = settings.count;
        } catch (e) {
            console.error('設定の読み込みに失敗しました', e);
        }
    }

    function resetSettings() {
        localStorage.removeItem('randomGeneratorSettingsSimple');
        document.getElementById('min-num').value = '1';
        document.getElementById('max-num').value = '100';
        document.getElementById('count').value = '10';
        document.getElementById('warning-text').textContent = '';
        generateRandomNumbers();
    }

    function checkCount() {
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        const count = parseInt(countInput.value) || 0;

        if (count > 10000) {
            warningText.textContent = '※エラー: 10,000個以上は一括作成できません。';
        } else if (count > 100) {
            warningText.textContent = '※注意: 個数が多いため、作成やコピーに時間がかかる場合があります。';
        } else {
            warningText.textContent = '';
        }
    }

    function generateRandomNumbers() {
        const minInput = document.getElementById('min-num');
        const maxInput = document.getElementById('max-num');
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        
        let min = parseInt(minInput.value);
        let max = parseInt(maxInput.value);
        let count = parseInt(countInput.value) || 10;

        if (isNaN(min) || isNaN(max)) {
            warningText.textContent = '※エラー: 最小値と最大値には数値を入力してください。';
            return;
        }

        if (min > max) {
            const temp = min;
            min = max;
            max = temp;
            minInput.value = min;
            maxInput.value = max;
        }

        if (count > 10000) {
            warningText.textContent = '※エラー: 10,000個以上は一括作成できません。';
            return;
        }
        if (count < 1) count = 1;

        if (count > 100) {
            warningText.textContent = '※注意: 個数が多いため、作成やコピーに時間がかかる場合があります。';
        } else {
            warningText.textContent = '';
        }

        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = ''; 
        document.getElementById('copy-msg').textContent = '';
        
        const generatedList = [];
        const range = max - min + 1;

        for (let i = 0; i < count; i++) {
            const num = Math.floor(Math.random() * range) + min;
            generatedList.push(num);
        }

        currentRandomNumbers = generatedList;

        currentRandomNumbers.forEach((num) => {
            const row = document.createElement('div');
            row.className = 'result-row';

            const container = document.createElement('div');
            container.className = 'result-container';
            container.textContent = num;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'コピー';
            btn.onclick = function() { copyText(num); };

            row.appendChild(container);
            row.appendChild(btn);
            resultArea.appendChild(row);
        });
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'クリップボードにコピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('コピーに失敗しました: ', err);
        });
    }

    function copyAllText() {
        if (currentRandomNumbers.length === 0) {
            alert('コピーするデータがありません。');
            return;
        }
        
        const allText = currentRandomNumbers.join('\n');
        
        navigator.clipboard.writeText(allText).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'すべての乱数を一括コピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('一括コピーに失敗しました: ', err);
        });
    }

    function downloadCSV() {
        if (currentRandomNumbers.length === 0) {
            alert('ダウンロードするデータがありません。');
            return;
        }

        const csvContent = currentRandomNumbers.join('\r\n') + '\r\n';
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        const now = new Date();
        const timestamp = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + '_' +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
            
        link.setAttribute('href', url);
        link.setAttribute('download', `random_numbers_${timestamp}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadHeader();
        loadSettings();
        generateRandomNumbers();
    });
</script>

</body>
</html>
