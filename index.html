<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="好みの設定で自動生成する無料の乱数ジェネレーターです。桁数や個数の指定が可能。一括コピーやCSV保存にも対応しています。">
    <meta property="og:site_name" content="便利ツールコレクション">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://renowahappiness-prog.github.io/mytool/index.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="乱数・パスワードジェネレーターツール">
    <title>乱数ジェネレーター</title>
    <link rel="stylesheet" href="style.css">
    <link rel="canonical" href="https://renowahappiness-prog.github.io/mytool/index.html">
</head>
<body>

<header class="global-header" id="header-placeholder"></header>

<div class="container">
    <h2>乱数ジェネレーター</h2>
    
    <div class="settings-group">
        <div class="input-group">
            <label for="digits">乱数桁数</label>
            <input type="number" id="digits" value="9" min="1" max="100" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="count">作成個数</label>
            <input type="number" id="count" value="10" min="1" max="100" oninput="checkCount()" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label>数字の重複</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="duplicate" value="false" checked onchange="saveSettings()">なし</label>
                <label class="radio-label"><input type="radio" name="duplicate" value="true" onchange="saveSettings()">あり</label>
            </div>
        </div>
        <div class="input-group">
            <label for="prefix">前テキスト</label>
            <input type="text" id="prefix" value="" placeholder="任意" onchange="saveSettings()">
            <span class="example-text">（例: 前テキスト-123 ）</span>
        </div>
        <div class="input-group">
            <label for="suffix">後テキスト</label>
            <input type="text" id="suffix" value="" placeholder="任意" onchange="saveSettings()">
            <span class="example-text">（例: 123-後テキスト ）</span>
        </div>
    </div>

    <div class="warning-text" id="warning-text"></div>

    <div class="btn-group">
        <button class="generate-btn" onclick="generateRandoms()">乱数を作成</button>
        <button class="copy-all-btn" onclick="copyAllText()">一括コピー</button>
        <button class="download-btn" onclick="downloadCSV()">CSV保存</button>
        <button class="reset-btn" onclick="resetSettings()">リセット</button>
    </div>

    <div class="result-area" id="result-area">
    </div>
    
    <div class="msg" id="copy-msg"></div>
</div>

<div class="ad-space-bottom">
    <span class="ad-label">スポンサーリンク</span>
    <div class="ad-box">
    <script src="https://adm.shinobi.jp/s/d149ee751a7bfab9ce516b030c1e447d"></script>
    </div>
</div>

<script>
    // index.htmlのヘッダー読み込み処理を維持
    function loadHeader() {
        fetch('header.html')
            .then(response => {
                if (!response.ok) throw new Error('ヘッダーの読み込みに失敗しました');
                return response.text();
            })
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-random');
                if (activeLink) activeLink.classList.add('active');
            })
            .catch(error => console.error(error));
    }

    let currentRandomNumbers = [];

    // 「乱数.html」のロジックをベースにしたLocalStorage保存・読込・リセット
    function saveSettings() {
        const settings = {
            prefix: document.getElementById('prefix').value,
            digits: document.getElementById('digits').value,
            suffix: document.getElementById('suffix').value,
            duplicate: document.querySelector('input[name="duplicate"]:checked').value,
            count: document.getElementById('count').value
        };
        localStorage.setItem('generatorSettings', JSON.stringify(settings));
    }

    function loadSettings() {
        const savedData = localStorage.getItem('generatorSettings');
        if (!savedData) return;

        try {
            const settings = JSON.parse(savedData);
            if (settings.prefix !== undefined) document.getElementById('prefix').value = settings.prefix;
            if (settings.digits !== undefined) document.getElementById('digits').value = settings.digits;
            if (settings.suffix !== undefined) document.getElementById('suffix').value = settings.suffix;
            if (settings.count !== undefined) document.getElementById('count').value = settings.count;
            if (settings.duplicate !== undefined) {
                const radio = document.querySelector(`input[name="duplicate"][value="${settings.duplicate}"]`);
                if (radio) radio.checked = true;
            }
        } catch (e) {
            console.error('設定の読み込みに失敗しました', e);
        }
    }

    function resetSettings() {
        localStorage.removeItem('generatorSettings');
        document.getElementById('prefix').value = '';
        document.getElementById('digits').value = '9';
        document.getElementById('suffix').value = '';
        document.getElementById('count').value = '10';
        const defaultRadio = document.querySelector('input[name="duplicate"][value="false"]');
        if (defaultRadio) defaultRadio.checked = true;
        document.getElementById('warning-text').textContent = '';
        generateRandoms();
    }

    function checkCount() {
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        const count = parseInt(countInput.value) || 0;

        if (count > 100) {
            warningText.textContent = '※エラー: 100個以上は作成できません。';
        } else {
            warningText.textContent = '';
        }
    }

    // 「乱数.html」のメイン機能（桁数指定・重複検知・前後テキスト付与）
    function generateRandoms() {
        const prefixInput = document.getElementById('prefix');
        const suffixInput = document.getElementById('suffix');
        const digitsInput = document.getElementById('digits');
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        const allowDuplicate = document.querySelector('input[name="duplicate"]:checked').value === 'true';
        
        let prefix = prefixInput.value;
        let suffix = suffixInput.value;
        let digits = parseInt(digitsInput.value) || 9;
        let count = parseInt(countInput.value) || 10;

        if (count > 100) {
            warningText.textContent = '※エラー: 100個以上は作成できません。';
            return;
        }

        if (digits < 1) digits = 1;
        if (digits > 100) digits = 100;
        if (count < 1) count = 1;

        if (!allowDuplicate) {
            const maxCombinations = Math.min(Math.pow(10, digits), 100); 
            if (count > maxCombinations) {
                warningText.textContent = `※エラー: 重複なしの場合、${digits}桁では最大 ${maxCombinations}個までしか生成できません。`;
                return;
            }
        }

        warningText.textContent = '';

        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = ''; 
        document.getElementById('copy-msg').textContent = '';
        
        const generatedList = [];
        const uniqueNumbersSet = new Set();
        let safetyCounter = 0;

        while (generatedList.length < count && safetyCounter < 100000) {
            safetyCounter++;

            let randomNumber = '';
            for (let d = 0; d < digits; d++) {
                randomNumber += Math.floor(Math.random() * 10);
            }

            const finalString = prefix + randomNumber + suffix;

            if (allowDuplicate) {
                generatedList.push(finalString);
            } else {
                if (!uniqueNumbersSet.has(finalString)) {
                    uniqueNumbersSet.add(finalString);
                    generatedList.push(finalString);
                }
            }
        }

        currentRandomNumbers = generatedList;

        currentRandomNumbers.forEach((finalString) => {
            const row = document.createElement('div');
            row.className = 'result-row';

            const container = document.createElement('div');
            container.className = 'result-container';
            container.textContent = finalString;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'コピー';
            btn.onclick = function() { copyText(finalString); };

            row.appendChild(container);
            row.appendChild(btn);
            resultArea.appendChild(row);
        });
    }

    // 共通のコピー・CSVダウンロード処理
    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'クリップボードにコピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('コピーに失敗しました: ', err);
        });
    }

    function copyAllText() {
        if (currentRandomNumbers.length === 0) {
            alert('コピーするデータがありません。');
            return;
        }
        const allText = currentRandomNumbers.join('\n');
        navigator.clipboard.writeText(allText).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'すべての乱数を一括コピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('一括コピーに失敗しました: ', err);
        });
    }

    function downloadCSV() {
        if (currentRandomNumbers.length === 0) {
            alert('ダウンロードするデータがありません。');
            return;
        }

        const csvContent = currentRandomNumbers.join('\r\n') + '\r\n';
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        const now = new Date();
        const timestamp = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + '_' +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
            
        link.setAttribute('href', url);
        link.setAttribute('download', `random_numbers_${timestamp}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 初期化（ヘッダー読込を追加）
    window.addEventListener('DOMContentLoaded', () => {
        loadHeader();
        loadSettings();
        generateRandoms();
    });
</script>

</body>
</html>
