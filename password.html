<!DOCTYPE html>
<html lang="ja">
<head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="安全なパスワードを自動生成する無料のパスワードジェネレーターです。桁数や個数の指定、英大文字・小文字・数字・記号の個別選択が可能。一括コピーやCSV保存にも対応しています。">
    <meta property="og:site_name" content="便利ツールコレクション">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://renowahappiness-prog.github.io/mytool/index.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="乱数・パスワードジェネレーターツール">
    <title>パスワードジェネレーター - 自動生成ツール（CSV保存対応）</title>
    <link rel="stylesheet" href="style.css">
    <link rel="canonical" href="https://renowahappiness-prog.github.io/mytool/password.html">
</head>
</head>
<body>

<header class="global-header" id="header-placeholder"></header>

<div class="container">
    <h2>パスワードジェネレーター</h2>
    
    <div class="settings-group">
        <div class="input-group">
            <label for="digits">パスワード桁数</label>
            <input type="number" id="digits" value="12" min="4" max="100" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="count">作成個数</label>
            <input type="number" id="count" value="10" min="1" max="100" oninput="checkCount()" onchange="saveSettings()">
        </div>
    </div>

    <div class="checkbox-card-group">
        <label class="checkbox-label"><input type="checkbox" id="use-upper" checked onchange="saveSettings()">英大文字 (A-Z)</label>
        <label class="checkbox-label"><input type="checkbox" id="use-lower" checked onchange="saveSettings()">英小文字 (a-z)</label>
        <label class="checkbox-label"><input type="checkbox" id="use-numbers" checked onchange="saveSettings()">数字 (0-9)</label>
        <label class="checkbox-label"><input type="checkbox" id="use-symbols" onchange="toggleSymbolDetails(); saveSettings();">記号 (個別選択)</label>
    </div>

    <div class="details-wrapper" id="symbol-details-wrapper" style="display: none;">
        <details id="symbol-details">
            <summary class="details-summary">▼ 使用する記号を個別に選択</summary>
            <div class="symbol-selection-grid" id="symbol-container">
            </div>
        </details>
    </div>

    <div class="warning-text" id="warning-text"></div>

    <div class="btn-group">
        <button class="generate-btn" onclick="generatePasswords()">パスワードを作成</button>
        <button class="copy-all-btn" onclick="copyAllText()">一括コピー</button>
        <button class="download-btn" onclick="downloadCSV()">CSV保存</button>
        <button class="reset-btn" onclick="resetSettings()">リセット</button>
    </div>

    <div class="result-area" id="result-area">
    </div>
    
    <div class="msg" id="copy-msg"></div>
</div>

<div class="ad-space-bottom">
    <span class="ad-label">スポンサーリンク</span>
    <div class="ad-box">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/d149ee751a7bfab9ce516b030c1e447d"></script>
    <!-- admax -->
    </div>
</div>

<script>
    function loadHeader() {
        fetch('header.html')
            .then(response => {
                if (!response.ok) throw new Error('ヘッダーの読み込みに失敗しました');
                return response.text();
            })
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-password');
                if (activeLink) activeLink.classList.add('active');
            })
            .catch(error => console.error(error));
    }

    let currentPasswords = [];

    const UPPERCASE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const LOWERCASE_CHARS = 'abcdefghijklmnopqrstuvwxyz';
    const NUMBER_CHARS = '0123456789';
    const ALL_SYMBOLS = ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')', '_', '+', '-', '='];

    function createSymbolCheckboxes() {
        const container = document.getElementById('symbol-container');
        container.innerHTML = '';
        ALL_SYMBOLS.forEach((sym, index) => {
            const label = document.createElement('label');
            label.className = 'symbol-label';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = sym;
            checkbox.id = `sym-${index}`;
            checkbox.checked = true;
            checkbox.onchange = saveSettings;
            
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(sym));
            container.appendChild(label);
        });
    }

    function toggleSymbolDetails() {
        const useSymbols = document.getElementById('use-symbols').checked;
        const wrapper = document.getElementById('symbol-details-wrapper');
        const details = document.getElementById('symbol-details');
        
        if (useSymbols) {
            wrapper.style.display = 'block';
        } else {
            wrapper.style.display = 'none';
            details.open = false;
        }
    }

    function getSelectedSymbols() {
        const checkboxes = document.querySelectorAll('#symbol-container input[type="checkbox"]');
        let selected = '';
        checkboxes.forEach(cb => {
            if (cb.checked) {
                selected += cb.value;
            }
        });
        return selected;
    }

    function saveSettings() {
        const checkboxes = document.querySelectorAll('#symbol-container input[type="checkbox"]');
        const symbolStates = Array.from(checkboxes).map(cb => cb.checked);

        const settings = {
            digits: document.getElementById('digits').value,
            count: document.getElementById('count').value,
            useUpper: document.getElementById('use-upper').checked,
            useLower: document.getElementById('use-lower').checked,
            useNumbers: document.getElementById('use-numbers').checked,
            useSymbols: document.getElementById('use-symbols').checked,
            symbolStates: symbolStates
        };
        localStorage.setItem('passwordGeneratorSettingsSimple', JSON.stringify(settings));
    }

    function loadSettings() {
        const savedData = localStorage.getItem('passwordGeneratorSettingsSimple');
        if (!savedData) return;

        try {
            const settings = JSON.parse(savedData);
            
            if (settings.digits !== undefined) document.getElementById('digits').value = settings.digits;
            if (settings.count !== undefined) document.getElementById('count').value = settings.count;
            
            if (settings.useUpper !== undefined) document.getElementById('use-upper').checked = settings.useUpper;
            if (settings.useLower !== undefined) document.getElementById('use-lower').checked = settings.useLower;
            if (settings.useNumbers !== undefined) document.getElementById('use-numbers').checked = settings.useNumbers;
            if (settings.useSymbols !== undefined) document.getElementById('use-symbols').checked = settings.useSymbols;
            
            if (settings.symbolStates !== undefined) {
                const checkboxes = document.querySelectorAll('#symbol-container input[type="checkbox"]');
                checkboxes.forEach((cb, index) => {
                    if (settings.symbolStates[index] !== undefined) {
                        cb.checked = settings.symbolStates[index];
                    }
                });
            }
            
            toggleSymbolDetails();
        } catch (e) {
            console.error('設定の読み込みに失敗しました', e);
        }
    }

    function resetSettings() {
        localStorage.removeItem('passwordGeneratorSettingsSimple');

        document.getElementById('digits').value = '12';
        document.getElementById('count').value = '10';
        
        document.getElementById('use-upper').checked = true;
        document.getElementById('use-lower').checked = true;
        document.getElementById('use-numbers').checked = true;
        document.getElementById('use-symbols').checked = false;

        const checkboxes = document.querySelectorAll('#symbol-container input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = true);

        document.getElementById('warning-text').textContent = '';
        
        toggleSymbolDetails();
        generatePasswords();
    }

    function checkCount() {
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        const count = parseInt(countInput.value) || 0;

        if (count > 100) {
            warningText.textContent = '※エラー: 100個以上は作成できません。';
        } else {
            warningText.textContent = '';
        }
    }

    function generatePasswords() {
        const digitsInput = document.getElementById('digits');
        const countInput = document.getElementById('count');
        const warningText = document.getElementById('warning-text');
        
        const useUpper = document.getElementById('use-upper').checked;
        const useLower = document.getElementById('use-lower').checked;
        const useNumbers = document.getElementById('use-numbers').checked;
        const useSymbols = document.getElementById('use-symbols').checked;
        
        let digits = parseInt(digitsInput.value) || 12;
        let count = parseInt(countInput.value) || 10;

        if (count > 100) {
            warningText.textContent = '※エラー: 100個以上は作成できません。';
            return;
        }

        if (digits < 4) digits = 4;
        if (digits > 100) digits = 100;
        if (count < 1) count = 1;

        let charPool = '';
        let requiredPools = [];
        let nonSymbolPool = '';

        if (useUpper) { charPool += UPPERCASE_CHARS; nonSymbolPool += UPPERCASE_CHARS; requiredPools.push(UPPERCASE_CHARS); }
        if (useLower) { charPool += LOWERCASE_CHARS; nonSymbolPool += LOWERCASE_CHARS; requiredPools.push(LOWERCASE_CHARS); }
        if (useNumbers) { charPool += NUMBER_CHARS; nonSymbolPool += NUMBER_CHARS; requiredPools.push(NUMBER_CHARS); }
        
        let activeSymbols = '';
        if (useSymbols) { 
            activeSymbols = getSelectedSymbols();
            if (activeSymbols.length > 0) {
                charPool += activeSymbols; 
                requiredPools.push(activeSymbols); 
            }
        }

        if (nonSymbolPool === '') {
            warningText.textContent = '※エラー: 1文字目を記号にしないため、英大文字・英小文字・数字のいずれかを少なくとも1つ選択してください。';
            return;
        }

        warningText.textContent = '';

        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = ''; 
        document.getElementById('copy-msg').textContent = '';
        
        const generatedList = [];

        for (let i = 0; i < count; i++) {
            let passwordChars = [];

            requiredPools.forEach(pool => {
                const randomChar = pool.charAt(Math.floor(Math.random() * pool.length));
                passwordChars.push(randomChar);
            });

            const remainingDigits = digits - passwordChars.length;
            for (let d = 0; d < remainingDigits; d++) {
                const randomChar = charPool.charAt(Math.floor(Math.random() * charPool.length));
                passwordChars.push(randomChar);
            }

            for (let s = passwordChars.length - 1; s > 0; s--) {
                const j = Math.floor(Math.random() * (s + 1));
                [passwordChars[s], passwordChars[j]] = [passwordChars[j], passwordChars[s]];
            }

            if (activeSymbols.includes(passwordChars[0])) {
                let swapIndex = -1;
                for (let k = 1; k < passwordChars.length; k++) {
                    if (!activeSymbols.includes(passwordChars[k])) {
                        swapIndex = k;
                        break;
                    }
                }

                if (swapIndex !== -1) {
                    [passwordChars[0], passwordChars[swapIndex]] = [passwordChars[swapIndex], passwordChars[0]];
                } else {
                    passwordChars[0] = nonSymbolPool.charAt(Math.floor(Math.random() * nonSymbolPool.length));
                }
            }

            generatedList.push(passwordChars.join(''));
        }

        currentPasswords = generatedList;

        currentPasswords.forEach((finalString) => {
            const row = document.createElement('div');
            row.className = 'result-row';

            const container = document.createElement('div');
            container.className = 'result-container';
            container.textContent = finalString;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'コピー';
            btn.onclick = function() { copyText(finalString); };

            row.appendChild(container);
            row.appendChild(btn);
            resultArea.appendChild(row);
        });
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'クリップボードにコピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('コピーに失敗しました: ', err);
        });
    }

    function copyAllText() {
        if (currentPasswords.length === 0) {
            alert('コピーするデータがありません。');
            return;
        }
        
        const allText = currentPasswords.join('\n');
        
        navigator.clipboard.writeText(allText).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.textContent = 'すべてのパスワードを一括コピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }).catch(err => {
            console.error('一括コピーに失敗しました: ', err);
        });
    }

    function downloadCSV() {
        if (currentPasswords.length === 0) {
            alert('ダウンロードするデータがありません。');
            return;
        }

        const csvContent = currentPasswords.join('\r\n') + '\r\n';
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        const now = new Date();
        const timestamp = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + '_' +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
            
        link.setAttribute('href', url);
        link.setAttribute('download', `passwords_${timestamp}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadHeader();
        createSymbolCheckboxes();
        loadSettings();
        generatePasswords();
    });
</script>

</body>
</html>
